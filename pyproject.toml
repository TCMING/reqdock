[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-post-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.136.3", "uvicorn==0.49.0", "httpx==0.28.1", "httpcore==1.0.9", "pydantic==2.13.4", "keyring==25.7.0", "psutil==7.2.2", "httpx-sse==0.4.3", "pywebview==6.2.1", "PyMySQL==1.2.3", "sqlglot==30.25.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
